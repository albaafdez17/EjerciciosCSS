<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: black;
        }

        ul {
            list-style-type: none;
            padding: 0;
            width: 200px;
        }

        li {
            padding: 10px;
            border: 1px solid transparent;
        }

        li:hover {
            border: 1px solid red;
        }

        a {
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <table>
        <tr>
          <th>Cambio</th>
          <th>Compra</th>
          <th>Venta</th>
          <th>Máximo</th>
          <th>Mínimo</th>
        </tr>
        <tr>
          <th class="euro">Euro/Dolar</th>
          <td>1.25</td>
          <td>1.25</td>
          <td>1.25</td>
          <td>1.24</td>
        </tr>
        <tr>
          <th class="dolar">Dolar/Yen</th>
          <td>119.01</td>
          <td>119.05</td>
          <td>119.82</td>
          <td>119.82</td>
        </tr>
        <tr>
          <th class="libra">Libra/Dolar</th>
          <td>1.86</td>
          <td>1.86</td>
          <td>1.86</td>
          <td>1.85</td>
        </tr>
        <tr>
          <th class="yen">Yen/Euro</th>
          <td>0.67</td>
          <td>0.67</td>
          <td>0.66</td>
          <td>0.67</td>
        </tr>
      </table>
</body>
</html>
